# 艺术馆图片缓存 Worker 的部署配置。
#
# 注意：根目录的 wrangler.jsonc 是给站点静态资源用的（name = firefly），
# 这里是独立的一个 Worker，用 --config 指定本文件，互不干扰。
#
# 部署：
#   npx wrangler deploy --config workers/art-image/wrangler.toml
#
# 变量（S3_*）用 wrangler secret 或 API 配置，不写进仓库。

name = "stulanez-art-image"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
