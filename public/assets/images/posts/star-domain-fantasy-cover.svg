<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
	<title id="title">星域幻想</title>
	<desc id="desc">深色星空中环绕一颗粉紫色星球的轨道，配有小说标题与作者茶旻玥</desc>
	<defs>
		<linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#111326"/>
			<stop offset="0.56" stop-color="#24152f"/>
			<stop offset="1" stop-color="#090c18"/>
		</linearGradient>
		<radialGradient id="planet" cx="35%" cy="28%" r="70%">
			<stop offset="0" stop-color="#ffd8ed"/>
			<stop offset="0.38" stop-color="#e478b7"/>
			<stop offset="0.75" stop-color="#8e477f"/>
			<stop offset="1" stop-color="#382542"/>
		</radialGradient>
		<radialGradient id="glow">
			<stop offset="0" stop-color="#f59dcc" stop-opacity="0.5"/>
			<stop offset="1" stop-color="#f59dcc" stop-opacity="0"/>
		</radialGradient>
		<filter id="blur">
			<feGaussianBlur stdDeviation="22"/>
		</filter>
	</defs>

	<rect width="1600" height="900" fill="url(#space)"/>
	<circle cx="1240" cy="185" r="220" fill="url(#glow)" filter="url(#blur)"/>

