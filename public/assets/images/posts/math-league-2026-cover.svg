<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
	<title id="title">期末数学超级联赛</title>
	<desc id="desc">深蓝渐变背景上的数学符号与标题「期末数学超级联赛」，寓意把复习变成一场联赛</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0c1730"/>
			<stop offset="0.52" stop-color="#15264e"/>
			<stop offset="1" stop-color="#081026"/>
		</linearGradient>
		<radialGradient id="glow" cx="76%" cy="22%" r="64%">
			<stop offset="0" stop-color="#7fc7ff" stop-opacity="0.32"/>
			<stop offset="1" stop-color="#7fc7ff" stop-opacity="0"/>
		</radialGradient>
		<filter id="blur">
			<feGaussianBlur stdDeviation="26"/>
		</filter>
	</defs>

	<rect width="1600" height="900" fill="url(#bg)"/>
	<circle cx="1220" cy="180" r="320" fill="url(#glow)" filter="url(#blur)"/>

	<!-- 数学网格符号 -->
	<g stroke="#9fd0ff" stroke-opacity="0.5" fill="none" stroke-width="3">
		<line x1="1150" y1="150" x2="1500" y2="150"/>
		<line x1="1150" y1="200" x2="1500" y2="200"/>
		<line x1="1150" y1="250" x2="1500" y2="250"/>
		<line x1="1200" y1="100" x2="1200" y2="300"/>
		<line x1="1250" y1="100" x2="1250" y2="300"/>
	</g>
	<text x="1355" y="252" fill="#bfe0ff" font-family="'Georgia',serif" font-size="80" font-style="italic" text-anchor="middle">∑</text>
	<text x="1522" y="176" fill="#7fc7ff" font-family="'Georgia',serif" font-size="42" opacity="0.8">+</text>
	<text x="1476" y="176" fill="#7fc7ff" font-family="'Georgia',serif" font-size="42" opacity="0.8">−</text>

	<path d="M96 368h430" stroke="#79c2ff" stroke-width="4"/>

	<text x="96" y="456" fill="#fff" font-family="'Noto Serif SC','Songti SC',serif" font-size="104" font-weight="700" letter-spacing="10">期末数学超级联赛</text>
	<text x="100" y="526" fill="#bfe0ff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="28" letter-spacing="14">MATH SUPER LEAGUE</text>
	<text x="100" y="700" fill="#fff" fill-opacity="0.72" font-family="'Noto Serif SC','Songti SC',serif" font-size="32" letter-spacing="8">把复习变成一场联赛</text>
	<text x="100" y="756" fill="#fff" fill-opacity="0.42" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="20" letter-spacing="4">五大赛制 · 19 卷 · 49 人晋级</text>
</svg>
