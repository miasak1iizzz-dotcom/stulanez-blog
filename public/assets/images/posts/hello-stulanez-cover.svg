<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
	<title id="title">永恒欲望上线了</title>
	<desc id="desc">粉紫色渐变背景上，标题「永恒欲望」与站点副标题，寓意个人站点开启</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#1e0f2d"/>
			<stop offset="0.52" stop-color="#3a1236"/>
			<stop offset="1" stop-color="#160a20"/>
		</linearGradient>
		<radialGradient id="glow" cx="78%" cy="20%" r="60%">
			<stop offset="0" stop-color="#f5a3d0" stop-opacity="0.45"/>
			<stop offset="1" stop-color="#f5a3d0" stop-opacity="0"/>
		</radialGradient>
		<filter id="blur">
			<feGaussianBlur stdDeviation="26"/>
		</filter>
	</defs>

	<rect width="1600" height="900" fill="url(#bg)"/>
	<circle cx="1240" cy="170" r="300" fill="url(#glow)" filter="url(#blur)"/>

	<g fill="#fff" opacity="0.7">
		<circle cx="120" cy="120" r="2"/>
		<circle cx="300" cy="250" r="1.5" opacity="0.5"/>
		<circle cx="520" cy="90" r="2.5" opacity="0.6"/>
		<circle cx="760" cy="300" r="1.5" opacity="0.45"/>
		<circle cx="980" cy="110" r="2" opacity="0.6"/>
		<circle cx="1180" cy="380" r="1.5" opacity="0.5"/>
		<circle cx="1440" cy="140" r="2" opacity="0.55"/>
		<circle cx="200" cy="600" r="1.5" opacity="0.5"/>
		<circle cx="520" cy="740" r="2" opacity="0.6"/>
		<circle cx="900" cy="680" r="1.5" opacity="0.5"/>
		<circle cx="1220" cy="780" r="2" opacity="0.55"/>
		<circle cx="1460" cy="620" r="1.5" opacity="0.45"/>
	</g>

	<path d="M112 366h360" stroke="#f29bc9" stroke-width="4"/>

	<text x="112" y="452" fill="#fff" font-family="'Noto Serif SC','Songti SC',serif" font-size="118" font-weight="700" letter-spacing="18">永恒欲望</text>
	<text x="117" y="524" fill="#f6c7df" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="28" letter-spacing="14">STULANEZ · 上线了</text>
	<text x="118" y="700" fill="#fff" fill-opacity="0.72" font-family="'Noto Serif SC','Songti SC',serif" font-size="32" letter-spacing="8">站点刚刚挂到网上</text>
	<text x="118" y="756" fill="#fff" fill-opacity="0.42" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="20" letter-spacing="4">代码 · 生活 · 还想继续做的事</text>
</svg>
